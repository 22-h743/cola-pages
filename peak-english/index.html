<body>
<div class="app"><aside class="side" id="side"><div class="brand"><div class="mark">P</div><div><b>Peak English</b><small>SCORE HIGHER, GO FURTHER</small></div></div><div class="label">Workspace</div><nav class="nav"><button data-route="dashboard">▦　学习总览</button><button data-route="listening">◉　听力训练</button><button data-route="speaking">◌　口语训练</button><button data-route="reading">▤　阅读训练</button><button data-route="writing">✎　写作训练</button></nav><div class="label" style="margin-top:27px">Your progress</div><nav class="nav"><button data-route="mistakes">⌁　错题本 <span id="mistake-count">0</span></button><button data-route="vocab">✦　词汇星球</button><button data-route="planner">□　冲分计划</button></nav><div class="bottom"><div class="streak"><strong>🔥 12 天</strong><small>连续学习，保持这个节奏</small></div><button class="person" id="account-btn" type="button" aria-label="注册或编辑本机学习账号"><span class="avatar" id="profile-avatar">L</span><b id="profile-name">Lin 的学习空间</b><br><small>　　目标：<span id="profile-goal">IELTS 7.5</span> · <span id="profile-action">注册账号</span></small></button></div></aside><main class="main"><header class="top"><div><button class="mobile" id="menu">☰</button><span>Workspace</span><b id="crumb">/ 学习总览</b></div><div class="top-right"><div class="switch"><button class="on" data-target="IELTS">IELTS</button><button data-target="CET-6">CET-6</button></div><span>♧</span><span class="avatar" id="header-avatar">L</span></div></header><div id="views"></div></main></div><div class="toast" id="toast"></div><div class="auth-modal" id="auth-modal" hidden><section class="auth-card" role="dialog" aria-modal="true" aria-labelledby="auth-title"><button class="auth-close" id="auth-close" type="button" aria-label="关闭">×</button><h2 id="auth-title">创建本机学习账号</h2><p>保存你的学习身份、目标和复习进度。登录后可在其他设备继续学习。</p><div class="auth-fields"><label class="auth-register-only">显示名称<input id="auth-name" maxlength="24" placeholder="例如：Lin"></label><label>邮箱<input id="auth-email" type="email" placeholder="name@example.com"></label><label class="auth-register-only">备考目标<select id="auth-target"><option value="IELTS">IELTS · 目标 7.5</option><option value="CET-6">CET-6 · 目标 600+</option></select></label><label class="auth-register-only">当前基础<select id="auth-level"><option value="基础待评估">基础待评估</option><option value="IELTS 5.5">IELTS 5.5</option><option value="IELTS 6.5">IELTS 6.5</option><option value="CET-6 500">CET-6 500</option><option value="CET-6 550">CET-6 550</option></select></label><label class="auth-register-only">优先突破<select id="auth-focus"><option value="listening">听力 · 精听与定位</option><option value="speaking">口语 · 流利度与拓展</option><option value="reading">阅读 · 定位与同义替换</option><option value="writing">写作 · 审题与表达</option></select></label><label class="auth-register-only">每日可学习时长<select id="auth-minutes"><option value="30">30 分钟</option><option value="45">45 分钟</option><option value="60">60 分钟</option><option value="90">90 分钟</option></select></label><label class="auth-register-only">计划周期（天）<input id="auth-days" type="number" min="7" max="180" value="42"></label><label>密码<input id="auth-password" type="password" minlength="6" placeholder="至少 6 位，仅用于本次校验"></label></div><div class="auth-error" id="auth-error" role="alert"></div><div class="auth-actions"><button class="blue-btn" id="register-account" type="button">创建账号</button><span class="muted" id="auth-status"></span><button class="auth-toggle" id="auth-toggle" type="button">已有账号？登录</button></div><div class="auth-note">登录后，学习进度会同步到你的其他设备；密码不会写入浏览器本地存储。</div></section></div>
<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)], toast=document.querySelector('#toast');
const storage={get(k,f=''){try{return localStorage.getItem(k)??f}catch(e){return f}},set(k,v){try{localStorage.setItem(k,v);return true}catch(e){return false}}};
const saved=(()=>{try{return JSON.parse(storage.get('peak-english-state','{}')||'{}')}catch(e){return {}}})();
let pageTimers=[];
function clearPageTimers(){pageTimers.forEach(clearInterval);pageTimers=[]}
const state={target:saved.target||'IELTS',speed:saved.speed||.85,tasks:saved.tasks||{},mistakes:(saved.mistakes||[]).filter(x=>!String(x.id||'').startsWith('demo')),plan:saved.plan||{1:[false,false,false],2:[false,false,false],3:[false,false]},custom:saved.custom||[],vocab:saved.vocab||[],draft:saved.draft||'',profile:saved.profile||{name:'Lin',email:'',registered:false,target:'IELTS',level:'基础待评估',focus:'listening',dailyMinutes:45,days:42}};
let authToken=storage.get('peak-english-token',''),syncTimer=null,authMode='register';
const API_BASE='https://cola-dispatch.marswave-543.workers.dev/peak-english-5c6b72';
async function api(path,options={}){let headers={...(options.headers||{}),'Content-Type':'application/json'};if(authToken)headers.Authorization='Bearer '+authToken;let response=await fetch(API_BASE+path,{...options,headers});let data=await response.json().catch(()=>({}));if(!response.ok)throw new Error(data.error||data.message||'请求失败，请稍后重试');return data}
async function syncNow(){if(!authToken)return;try{await api('/api/state',{method:'PUT',body:JSON.stringify({state})})}catch(e){console.warn('同步暂不可用',e)}}
function scheduleSync(){if(!authToken)return;clearTimeout(syncTimer);syncTimer=setTimeout(syncNow,350)}
function persist(){storage.set('peak-english-state',JSON.stringify(state));const count=document.querySelector('#mistake-count');if(count)count.textContent=state.mistakes.filter(x=>!x.mastered).length||0;scheduleSync()}
async function restoreCloud(){if(!authToken)return false;try{let me=await api('/api/_auth/me');let remote=await api('/api/state');if(remote.state){let incoming=JSON.parse(remote.state);if(incoming&&typeof incoming==='object')Object.assign(state,incoming)}state.mistakes=(state.mistakes||[]).filter(x=>!String(x.id||'').startsWith('demo'));state.profile={...(state.profile||{}),name:me.name||state.profile?.name||'学习者',email:me.email||state.profile?.email||'',registered:true};state.target=state.profile.target||state.target;storage.set('peak-english-state',JSON.stringify(state));render();return true}catch(e){authToken='';storage.set('peak-english-token','');return false}}
function esc(v){return String(v).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function applyProfile(){let p=state.profile||{};let name=(p.name||'Lin').trim()||'Lin',initial=name.slice(0,1).toUpperCase();let avatar=$('#profile-avatar'),label=$('#profile-name'),goal=$('#profile-goal'),action=$('#profile-action');if(avatar)avatar.textContent=initial;if(label)label.textContent=name+' 的学习空间';if(goal)goal.textContent=state.target==='IELTS'?'IELTS 7.5':'CET-6 600+';if(action)action.textContent=p.registered?'编辑资料':'注册账号';let headerAvatar=$('#header-avatar');if(headerAvatar)headerAvatar.textContent=initial}
function say(m){toast.textContent=m;toast.classList.add('show');clearTimeout(window.toast);window.toast=setTimeout(()=>toast.classList.remove('show'),2200)}
function route(){return location.hash.replace('#/','')||(authToken?'dashboard':'welcome')}
function setRoute(r){if(!authToken&&r!=='welcome'){location.hash='/welcome';say('先创建学习账号，再开始你的训练');return}location.hash='/'+r}
function learner(){let p=state.profile||{};return {name:(p.name||'Lin').trim()||'Lin',level:p.level||'基础待评估',focus:p.focus||'listening',minutes:Number(p.dailyMinutes)||45,days:Math.min(180,Math.max(7,Number(p.days)||42))}}
function focusInfo(){return {listening:{title:'听力定位与精听',short:'听力',focus:'地图题与场景词',rows:[['地图题定位专项','每天 1 组 + 整理方位词'],['精听复盘','听写、对照、影子跟读'],['场景词回收','复习 30 个校园与旅行词']]},speaking:{title:'口语流利度与拓展',short:'口语',focus:'Part 2 观点输出',rows:[['Part 2 素材库','积累 3 个可迁移故事'],['2 分钟录音','每周录音 3 次并复听'],['连接词升级','替换重复的 Firstly / Secondly']]},reading:{title:'阅读定位与同义替换',short:'阅读',focus:'定位词与主旨题',rows:[['段落定位训练','每次 2 篇限时精读'],['同义替换本','整理题干与原文替换'],['速度冲刺','每篇控制在 18 分钟内']]},writing:{title:'写作审题与表达',short:'写作',focus:'Task 2 结构与论证',rows:[['审题与立场','每天拆解 2 道题目'],['主体段精写','理由 + 例子各写一段'],['句式升级','复盘 5 个可复用表达']]}}[learner().focus]||{title:'听力定位与精听',short:'听力',focus:'地图题与场景词',rows:[]}}
function adaptivePlan(){let l=learner(),f=focusInfo(),goal=state.target==='IELTS'?'IELTS 7.5':'CET-6 600+';return {1:[['建立诊断基线',`${l.level} → ${goal}；每天 ${l.minutes} 分钟`],['核心词汇回收','每日 50 词 + 间隔复习'],['基础输入复盘','听读各 1 个短任务']],2:f.rows,3:[['全真模考计时',`严格按 ${state.target} 考试时间完成`],['弱项错题清零',`优先复习${f.short}错题并记录原因`]]}}
function layout(title,body){return `<div class="view active"><div class="page-title"><div><h1>${title}</h1><p>每一次有反馈的练习，都会变成考场上的确定性。</p></div><button class="back" data-route="dashboard">← 返回总览</button></div>${body}</div>`}
function welcome(){return `<section class="welcome"><header class="welcome-nav"><div class="welcome-brand"><div class="mark">P</div><div><b>Peak English</b><small>SCORE HIGHER, GO FURTHER</small></div></div><div class="welcome-nav-actions"><button class="welcome-login" id="welcome-login">登录</button><button class="welcome-login" id="welcome-register">创建学习档案</button></div></header><div class="welcome-hero"><div class="welcome-copy"><div class="eyebrow">IELTS · CET-6 · PERSONAL STUDY SYSTEM</div><h1>不是刷题更多，<br>而是<em>练得更准。</em></h1><p>Peak English 为每位学习者生成可执行的冲分路线。告诉我们你的目标、基础、薄弱项和可投入时间，从今天第一项任务开始，把听说读写练成稳定的得分能力。</p><div class="welcome-actions"><button class="welcome-cta" id="welcome-start">免费创建学习档案 →</button><span class="welcome-note">无需下载，注册后立即开始训练</span></div></div><aside class="welcome-preview"><div class="preview-top"><span>个人计划示例</span><span class="preview-user"><span class="avatar">✦</span>为你生成</span></div><div class="preview-hero"><b>从你的目标开始</b><p>填写基础、薄弱项和可用时间，生成专属任务。</p></div><div class="preview-list"><div class="preview-task"><i>01</i>建立个人诊断基线</div><div class="preview-task"><i>02</i>选择优先突破科目</div><div class="preview-task"><i>03</i>开始今日第一项训练</div></div></aside></div><section class="welcome-section"><h2>注册后，你会得到什么？</h2><div class="welcome-grid"><article class="welcome-card"><div class="ico">◎</div><h3>个人冲分计划</h3><p>根据考试目标、当前基础、薄弱项、每日可用时长和周期生成三阶段任务。</p></article><article class="welcome-card"><div class="ico">◉</div><h3>四科主动训练</h3><p>听力朗读、口语计时、阅读反馈、写作草稿与错题复盘，不是只能看的展示页。</p></article><article class="welcome-card"><div class="ico">✦</div><h3>可持续的学习记录</h3><p>任务、词汇、错题、草稿与计划会安全保存；登录后可在其他设备继续学习。</p></article></div><div class="welcome-steps"><span><b>01</b>创建学习档案</span><span><b>02</b>生成个人计划</span><span><b>03</b>开始第一项训练</span></div></section></section>`}
function dashboard(){let done=Object.values(state.tasks).filter(Boolean).length,l=learner(),f=focusInfo();return `<div class="view active"><section class="hero"><div class="hero-copy"><div class="eyebrow">YOUR HIGH-SCORE JOURNEY · 2026</div><h1>早上好，${esc(l.name)}。今天也向高分靠近。✦</h1><p>当前优先突破：${f.focus}。按每天 ${l.minutes} 分钟的节奏练习，<br>把稳定的输入和刻意的输出变成考场上的确定性。</p><div class="meta"><span>${state.target} 目标 ${state.target==='IELTS'?'7.5':'600+'}</span><span>还剩 ${l.days} 天</span><span>今日完成 ${done}/4</span></div></div><div class="ring"><div><b>${Math.min(100,done*25)}%</b><small>备考进度</small></div></div></section><section class="section"><div class="head"><div><h2>本周表现</h2><p>比上周更接近目标一点点</p></div><span class="link">学习报告 →</span></div><div class="stats"><div class="card"><span class="muted">学习时长</span><div class="num">0<em>小时</em></div><div class="up">从第一项任务开始</div></div><div class="card"><span class="muted">词汇掌握</span><div class="num">${state.vocab.length}<em>/ 3</em></div><div class="up">今日高频词</div></div><div class="card"><span class="muted">模考均分</span><div class="num">—<em>待测</em></div><div class="up">完成模考后生成</div></div><div class="card"><span class="muted">连续学习</span><div class="num">${done?1:0}<em>天</em></div><div style="font-size:10px;color:var(--orange);margin-top:5px">稳定完成今日任务</div></div></div></section><section class="section content"><div class="panel"><div class="head"><div><h2 style="font-size:13px">学习时长趋势</h2><p>每日专注时长（小时）</p></div><span class="muted">本周⌄</span></div><div class="chart">${[0,0,0,0,0,0,done?25:0].map((h,i)=>`<div class="barcol ${i===6?'today':''}"><i class="bar" style="height:${h}%"></i><span>${'一二三四五六日'[i]}</span></div>`).join('')}</div></div><div class="panel"><div class="head"><h2 style="font-size:13px">今日任务</h2><span class="link">${done}/4 已完成</span></div><div class="tasks">${[['listening','精听：BBC 6 Minute English','听力','20 min'],['speaking','Part 2 口语录音 · 城市生活','口语','15 min'],['reading','剑雅 18 · Test 2 阅读','阅读','45 min'],['writing','大作文审题与提纲','写作','30 min']].map(x=>`<div class="task ${state.tasks[x[0]]?'done':''}"><button class="check" data-task="${x[0]}">${state.tasks[x[0]]?'✓':''}</button><span class="name">${x[1]}</span><span class="tag">${x[2]}</span><span class="time">${x[3]}</span></div>`).join('')}</div></div></section><section class="section"><div class="head"><div><h2>四科冲分训练</h2><p>针对性练习，补齐你的最后一块短板</p></div><span class="link">训练记录 →</span></div><div class="skills"><article class="skill" data-route="listening"><div class="ico">◉</div><h3>听力 Listening</h3><p>精听 · 影子跟读 · 场景词</p><strong>薄弱项：地图题 →</strong></article><article class="skill" data-route="speaking"><div class="ico">◌</div><h3>口语 Speaking</h3><p>Part 2 · 观点拓展 · 发音</p><strong>待完成 2 个任务 →</strong></article><article class="skill" data-route="reading"><div class="ico">▤</div><h3>阅读 Reading</h3><p>定位 · 同义替换 · 速度</p><strong>正确率 78% ↑</strong></article><article class="skill" data-route="writing"><div class="ico">✎</div><h3>写作 Writing</h3><p>审题 · 结构 · 句式升级</p><strong>草稿自动保存 →</strong></article></div></section><section class="section lower"><div class="panel focus"><div class="kicker">TODAY'S FOCUS</div><h3>攻克地图题定位</h3><p>你的地图题正确率低于整体 16%。今天用 20 分钟掌握方位词 + 地图预判，完成后再做一组专项巩固。</p><div class="pills"><span class="pill">方位词 18 个</span><span class="pill">专项 1 组</span><span class="pill">预计 35 min</span></div><button class="primary" data-route="listening">开始专项训练 →</button></div><div class="panel"><div class="head"><div><h2>冲分路线</h2><p>${l.days} 天 · ${l.level} 到 ${state.target==='IELTS'?'IELTS 7.5':'CET-6 600+'}</p></div><span class="link" data-route="planner">调整计划</span></div>${['基础重建 · 输入提质','专项突破 · 找到提分点','模考冲刺 · 稳定输出'].map((x,i)=>`<div class="route ${i===0?'current':''}"><div class="day">0${i+1}<br>—</div><div class="route-info"><b>${x}</b><span>${['词汇 450 / 精听 3 次 / 语法复盘','小分专项训练 + 每周一次模考','套题计时 + 错题清零 + 考场策略'][i]}</span></div><span class="status ${i?'pending':''}">${i?'未开始':'进行中'}</span></div>`).join('')}</div></section></div>`}
function listening(){return layout('听力训练',`<div class="exercise-grid"><div class="exercise-card"><h2>地图题 · Campus café</h2><p class="subtle">先读题定位关键词，再听材料。建议精听三遍：第一遍抓大意，第二遍记定位词，第三遍跟读。</p><div class="audio-box"><span class="muted">Listening script · IELTS Section 2</span><p>The new café is opposite the library, next to the student union. If you are coming from the main gate, walk past the science building and turn left.</p><div class="audio-controls"><button class="play" id="speak">▶</button><span id="audio-label" class="muted">点击播放朗读 · 语速 0.85x</span><button class="speed" id="speed">0.85x</button></div></div><h3>Where is the new café?</h3><div id="listen-options"><button class="option" data-answer="A">A. Behind the science building</button><button class="option" data-answer="B">B. Opposite the library</button><button class="option" data-answer="C">C. Inside the student union</button><button class="option" data-answer="D">D. Near the main gate</button></div><button class="blue-btn" id="submit-listen">提交答案</button><div id="listen-feedback"></div></div><div class="side-stat"><div class="metric"><b>地图题</b><span>当前专项 · 预计 20 min</span></div><div class="metric"><b>78%</b><span>本类题平均正确率</span></div><div class="metric"><b>精听 3 遍</b><span>听写 → 对照 → 跟读</span></div></div></div>`)}
function speaking(){return layout('口语训练',`<div class="exercise-grid"><div class="exercise-card"><h2>IELTS Speaking Part 2</h2><p class="subtle">Describe a city you would like to live in. You should say where it is, what it is like, and explain why you would like to live there.</p><div class="panel" style="background:#f8faff;margin-top:18px"><span class="muted">准备时间</span><div class="timer" id="prep-time">01:00</div><button class="blue-btn" id="prep">开始 1 分钟准备</button><span class="muted" style="margin-left:10px">先写 3 个关键词</span></div><div class="record" id="record-box"><p class="subtle">准备好后进行 2 分钟录音，关注流利度、连接词和观点拓展。</p><button id="record">● 开始录音</button><div class="timer" id="speak-time" style="font-size:24px;margin:12px 0 0">02:00</div><small id="record-note" class="muted">录音会保存在本次浏览器会话中</small></div></div><div class="side-stat"><div class="metric"><b>Part 2</b><span>观点拓展 · 流利度</span></div><div class="metric"><b>3 个</b><span>关键词即可成段</span></div><div class="metric"><b id="record-count">0 次</b><span>本地练习记录</span></div></div></div>`)}
function reading(){return layout('阅读训练',`<div class="exercise-grid"><div class="exercise-card"><h2>Matching headings · Urban green spaces</h2><div class="reading-text">Urban parks are no longer viewed merely as attractive additions to a city. Recent studies suggest that access to green spaces can reduce stress, encourage physical activity, and strengthen neighbourhood ties. However, simply building a park does not guarantee these benefits. Its design, safety and connection to public transport all influence how often residents use it.</div><h3>Which statement best summarises the paragraph?</h3><div id="read-options"><button class="option" data-answer="A">A. Parks are expensive but beautiful parts of cities.</button><button class="option" data-answer="B">B. Green spaces can improve urban life, but their design affects their use.</button><button class="option" data-answer="C">C. Public transport is the main reason people visit parks.</button></div><button class="blue-btn" id="submit-read">提交答案</button><div id="read-feedback"></div></div><div class="side-stat"><div class="metric"><b>18:42</b><span>本篇建议用时</span></div><div class="metric"><b>定位词</b><span>however · influence</span></div><div class="metric"><b>78%</b><span>你的近期正确率</span></div></div></div>`)}
function writing(){return layout('写作训练',`<div class="exercise-grid"><div class="exercise-card"><h2>IELTS Writing Task 2</h2><p class="subtle">Some people believe that universities should only offer places to students with the highest grades. To what extent do you agree or disagree?</p><textarea class="writing-area" id="draft" placeholder="在这里完成你的 essay。先写清立场，再展开两个主体段……">${state.draft.replace(/</g,'&lt;')}</textarea><div class="write-tools"><span id="word-count">0 words</span><span id="save-state">草稿自动保存</span><button class="blue-btn" id="save-draft">保存草稿</button></div><div id="writing-feedback"></div></div><div class="side-stat"><div class="metric"><b>40 min</b><span>建议完成时长</span></div><div class="metric"><b>250+</b><span>目标字数</span></div><div class="metric"><b>Band 7</b><span>观点清晰 · 衔接自然</span></div></div></div>`)}
function mistakes(){return layout('错题本',`<div class="panel"><div class="head"><div><h2>需要再次攻克的题目</h2><p>每道错题都记录了你的思维断点</p></div><span class="muted">${state.mistakes.filter(x=>!x.mastered).length} 道待复习</span></div><div>${state.mistakes.length?state.mistakes.map(m=>`<div class="mistake" data-id="${m.id}"><div><b>${m.skill} · ${m.title}</b><p>${m.question}<br>答案：<strong>${m.answer}</strong>　${m.reason}</p></div><div class="mini-actions">${m.mastered?'<span class="muted">已掌握</span>':`<button data-master="${m.id}">标记掌握</button>`}<button class="delete" data-delete="${m.id}">删除</button></div></div>`).join(''):'<p class="subtle">错题已清空，继续保持。</p>'}</div></div>`)}
function vocab(){let words=[['sustainable','/səˈsteɪnəbəl/','可持续的','Sustainable transport can reduce carbon emissions.'],['allocate','/ˈæləkeɪt/','分配；拨出','The school should allocate more funds to research.'],['compelling','/kəmˈpelɪŋ/','引人注目的；令人信服的','She gave a compelling reason for her decision.']];return layout('词汇星球',`<div class="head"><div><h2>今日高频词</h2><p>点击卡片翻面，回忆释义后再标记掌握</p></div><span class="link vocab-progress">已掌握 ${state.vocab.length}/3</span></div><div class="vocab-grid">${words.map((w,i)=>`<div class="word-card" data-word="${i}"><div class="word-inner"><div class="word-face"><div class="word">${w[0]}</div><div class="phonetic">${w[1]}</div><span class="muted" style="margin-top:auto">点击查看释义 ↗</span></div><div class="word-face back"><div class="meaning">${w[2]}</div><div class="example">${w[3]}</div><button class="master" data-vocab="${i}">${state.vocab.includes(i)?'已掌握 ✓':'标记掌握'}</button></div></div></div>`).join('')}</div>`)}
function planner(){let phase=window.planPhase||1,l=learner(),f=focusInfo(),plan=adaptivePlan();return layout('冲分计划',`<div class="panel"><div class="head"><div><h2>${l.days} 天个人冲分路线</h2><p>${l.level} · 每天 ${l.minutes} 分钟 · 优先突破：${f.title}</p></div><span class="link">${state.target} · 目标 ${state.target==='IELTS'?'7.5':'600+'}</span></div><div class="tabs">${[1,2,3].map(i=>`<button class="${phase===i?'on':''}" data-phase="${i}">第 ${i} 阶段</button>`).join('')}</div><div>${plan[phase].map((x,i)=>`<label class="plan-item ${state.plan[phase]?.[i]?'done':''}"><input type="checkbox" data-plan="${phase}-${i}" ${state.plan[phase]?.[i]?'checked':''}><div><b>${x[0]}</b><small>${x[1]}</small></div><span class="muted">${state.plan[phase]?.[i]?'完成':'待完成'}</span></label>`).join('')}</div><h3 style="font-size:13px;margin:22px 0 0">自定义任务</h3>${state.custom.map((x,i)=>`<label class="plan-item ${x.done?'done':''}"><input type="checkbox" data-custom="${i}" ${x.done?'checked':''}><div><b>${esc(x.text)}</b><small>自定义 · 加入你的冲分节奏</small></div></label>`).join('')}<div class="add-row"><input id="new-plan" placeholder="例如：周三完成一套听力 Section 3"><button class="blue-btn" id="add-plan">添加任务</button></div></div>`) }
function render(){clearPageTimers();let r=route();if(!authToken&&r!=='welcome')r='welcome';let html={welcome:welcome,dashboard:dashboard,listening:listening,speaking:speaking,reading:reading,writing:writing,mistakes:mistakes,vocab:vocab,planner:planner}[r]||welcome;$('.app').classList.toggle('welcome-mode',r==='welcome');$('#views').innerHTML=html();$$('[data-route]').forEach(b=>b.onclick=()=>setRoute(b.dataset.route));$$('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.route===r));$('#crumb').textContent='/ '+({welcome:'首页',dashboard:'学习总览',listening:'听力训练',speaking:'口语训练',reading:'阅读训练',writing:'写作训练',mistakes:'错题本',vocab:'词汇星球',planner:'冲分计划'}[r]||'首页');bind(r);$$('[data-target]').forEach(b=>b.onclick=()=>{state.target=b.dataset.target;state.profile.target=state.target;persist();applyProfile();$$('[data-target]').forEach(x=>x.classList.toggle('on',x===b));say('已切换至 '+state.target+' 冲分视图');if(route()==='planner')render()});$$('[data-target]').forEach(b=>b.classList.toggle('on',b.dataset.target===state.target));applyProfile();persist()}
function addMistake(m){if(!state.mistakes.some(x=>x.id===m.id))state.mistakes.unshift(m);persist()}
function bind(r){
 if(r==='welcome'){$('#welcome-register').onclick=()=>window.openAuth?.('register');$('#welcome-start').onclick=()=>window.openAuth?.('register');$('#welcome-login').onclick=()=>window.openAuth?.('login')}
 if(r==='dashboard'){$$('.check').forEach(b=>b.onclick=()=>{state.tasks[b.dataset.task]=!state.tasks[b.dataset.task];persist();render();say(state.tasks[b.dataset.task]?'任务完成，节奏很漂亮。':'任务已移回待完成')})}
 if(r==='listening'){let selected='';$$('#listen-options .option').forEach(b=>b.onclick=()=>{selected=b.dataset.answer;$$('#listen-options .option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected')});$('#submit-listen').onclick=()=>{if(!selected)return say('先选择一个答案');let ok=selected==='B';$$('#listen-options .option').forEach(x=>x.classList.toggle('correct',x.dataset.answer==='B'));if(!ok){$$('#listen-options .option').find(x=>x.dataset.answer===selected).classList.add('wrong');addMistake({id:'listen-'+Date.now(),skill:'听力',title:'地图题方位定位',question:'Where is the new café?',answer:'B. Opposite the library',reason:'opposite to 表示在……对面。',mastered:false})}$('#listen-feedback').innerHTML=`<div class="feedback">${ok?'回答正确！':'答案是 B。'} 先锁定 library 这个参照物，再利用 opposite to 判断位置。${ok?' 已记录为完成。':''}</div>`;state.tasks.listening=true;persist()};let speaking=false,rate=state.speed;$('#speed').textContent=rate.toFixed(2)+'x';$('#audio-label').textContent='点击播放朗读 · 语速 '+rate.toFixed(2)+'x';$('#speed').onclick=()=>{rate=rate===.85?1:rate===1?1.15:.85;state.speed=rate;persist();$('#speed').textContent=rate.toFixed(2)+'x';$('#audio-label').textContent='已切换至 '+rate.toFixed(2)+'x 语速'};$('#speak').onclick=()=>{if(!('speechSynthesis'in window))return say('当前浏览器不支持语音朗读');if(speaking){speechSynthesis.cancel();speaking=false;$('#speak').textContent='▶';$('#audio-label').textContent='已暂停朗读';return}let u=new SpeechSynthesisUtterance('The new café is opposite the library, next to the student union. If you are coming from the main gate, walk past the science building and turn left.');u.lang='en-US';u.rate=rate;u.onend=()=>{speaking=false;$('#speak').textContent='▶';$('#audio-label').textContent='朗读完成，可再听一遍'};speechSynthesis.speak(u);speaking=true;$('#speak').textContent='Ⅱ';$('#audio-label').textContent='正在朗读 · 点击暂停'} }
 if(r==='speaking'){let prepTimer,recordTimer,prepSec=60,speakSec=120,recorder,stream;const fmt=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');$('#prep').onclick=()=>{clearInterval(prepTimer);prepSec=60;$('#prep').textContent='准备中…';prepTimer=setInterval(()=>{prepSec--;$('#prep-time').textContent=fmt(prepSec);if(prepSec<=0){clearInterval(prepTimer);$('#prep').textContent='准备完成，开始输出';say('准备时间结束，进入 2 分钟输出')}} ,1000);pageTimers.push(prepTimer)};$('#record').onclick=async()=>{if(recorder&&recorder.state==='recording'){recorder.stop();stream?.getTracks().forEach(t=>t.stop());return}if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder){$('#record-note').textContent='当前环境无法访问麦克风，已切换为无录音计时模式';startSpeakingTimer();return}try{stream=await Promise.race([navigator.mediaDevices.getUserMedia({audio:true}),new Promise((_,reject)=>setTimeout(()=>reject(new Error('麦克风请求超时')),1500))]);recorder=new MediaRecorder(stream);recorder.onstop=()=>{clearInterval(recordTimer);state.tasks.speaking=true;persist();$('#record').textContent='● 开始录音';$('#record-box').classList.remove('recording');$('#record-note').textContent='本次练习已记录（音频仅保留在当前会话）';let n=Number(storage.get('peak-records','0'))+1;storage.set('peak-records',String(n));$('#record-count').textContent=n+' 次'};recorder.start();$('#record').textContent='■ 停止并保存';$('#record-box').classList.add('recording');startSpeakingTimer()}catch(e){$('#record-note').textContent='未获得麦克风权限，已切换为无录音计时模式';startSpeakingTimer()}};function startSpeakingTimer(){clearInterval(recordTimer);speakSec=120;recordTimer=setInterval(()=>{speakSec--;$('#speak-time').textContent=fmt(speakSec);if(speakSec<=0){clearInterval(recordTimer);state.tasks.speaking=true;persist();if(recorder?.state==='recording')recorder.stop();say('2 分钟输出完成，记得复盘连接词')}} ,1000);pageTimers.push(recordTimer)}$('#record-count').textContent=storage.get('peak-records','0')+' 次'}
 if(r==='reading'){let selected='';$$('#read-options .option').forEach(b=>b.onclick=()=>{selected=b.dataset.answer;$$('#read-options .option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected')});$('#submit-read').onclick=()=>{if(!selected)return say('先选择一个答案');let ok=selected==='B';$$('#read-options .option').forEach(x=>x.classList.toggle('correct',x.dataset.answer==='B'));if(!ok){$$('#read-options .option').find(x=>x.dataset.answer===selected).classList.add('wrong');addMistake({id:'read-'+Date.now(),skill:'阅读',title:'段落主旨概括',question:'Which statement best summarises the paragraph?',answer:'B. Green spaces can improve urban life, but their design affects their use.',reason:'转折句后的 design / use 是主旨落点。',mastered:false})}$('#read-feedback').innerHTML=`<div class="feedback">${ok?'回答正确！':'答案是 B。'} 文章先说益处，however 后补充使用效果取决于设计，这是典型主旨结构。</div>`;state.tasks.reading=true;persist()}}
 if(r==='writing'){const area=$('#draft'),count=()=>{let n=area.value.trim()?area.value.trim().split(/\s+/).length:0;$('#word-count').textContent=n+' words';state.draft=area.value;persist();$('#save-state').textContent='已自动保存 · '+new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})};area.oninput=count;count();$('#save-draft').onclick=()=>{count();state.tasks.writing=true;persist();$('#writing-feedback').innerHTML='<div class="feedback checklist"><div class="check-item">✓ 是否在开头明确表达 agree / disagree 立场</div><div class="check-item">✓ 两个主体段是否各自包含理由 + 例子</div><div class="check-item">○ 检查连接词是否自然，避免重复使用 Firstly</div></div>';say('草稿已保存，写作任务已完成')}}
 if(r==='mistakes'){$$('[data-master]').forEach(b=>b.onclick=()=>{let x=state.mistakes.find(x=>x.id===b.dataset.master);if(x)x.mastered=true;persist();render();say('已标记掌握，继续保持')});$$('[data-delete]').forEach(b=>b.onclick=()=>{state.mistakes=state.mistakes.filter(x=>x.id!==b.dataset.delete);persist();render();say('错题已删除')})}
 if(r==='vocab'){$$('.word-card').forEach(c=>c.onclick=e=>{if(e.target.matches('[data-vocab]')){let i=Number(e.target.dataset.vocab);if(!state.vocab.includes(i))state.vocab.push(i);persist();e.target.textContent='已掌握 ✓';let progress=$('.vocab-progress');if(progress)progress.textContent='已掌握 '+state.vocab.length+'/3';say('已加入掌握词汇')}else c.classList.toggle('flipped')})}
 if(r==='planner'){ $$('[data-phase]').forEach(b=>b.onclick=()=>{window.planPhase=Number(b.dataset.phase);render()});$$('[data-plan]').forEach(c=>c.onchange=()=>{let [p,i]=c.dataset.plan.split('-').map(Number);state.plan[p][i]=c.checked;persist();render();say(c.checked?'计划已完成':'已取消完成')});$$('[data-custom]').forEach(c=>c.onchange=()=>{state.custom[Number(c.dataset.custom)].done=c.checked;persist();render()});$('#add-plan').onclick=()=>{let input=$('#new-plan');if(!input.value.trim())return say('先写下一个计划任务');state.custom.push({text:input.value.trim(),done:false});persist();render();say('自定义任务已加入计划')}}}
function bindAccount(){const modal=$('#auth-modal'),close=()=>modal.hidden=true;const setMode=mode=>{authMode=mode;let login=mode==='login',edit=mode==='edit';modal.classList.toggle('login-mode',login);$('#auth-error').textContent='';$('#auth-password').value='';$('#auth-title').textContent=login?'登录学习账号':edit?'编辑学习资料':'创建学习账号';$('#register-account').textContent=login?'登录并同步数据':edit?'保存资料并同步':'创建账号并生成计划';$('#auth-toggle').textContent=login?'没有账号？创建学习账号':'已有账号？登录';$('#auth-status').textContent=login?'登录后将恢复你的学习记录':edit?'保存后会同步并重算你的个人计划':'创建后可在其他设备登录并同步记录'};const open=(mode=authToken?'edit':'register')=>{let p=state.profile||{};$('#auth-name').value=p.registered?p.name||'':'';$('#auth-email').value=p.registered?p.email||'':'';$('#auth-target').value=p.target||state.target;$('#auth-level').value=p.level||'基础待评估';$('#auth-focus').value=p.focus||'listening';$('#auth-minutes').value=String(p.dailyMinutes||45);$('#auth-days').value=p.days||42;setMode(mode);modal.hidden=false;$('#auth-email').focus()};window.openAuth=open;$('#account-btn').onclick=()=>open();$('#auth-close').onclick=close;modal.onclick=e=>{if(e.target===modal)close()};$('#auth-toggle').onclick=()=>open(authMode==='login'?'register':'login');$('#register-account').onclick=async()=>{let name=$('#auth-name').value.trim(),email=$('#auth-email').value.trim(),password=$('#auth-password').value,target=$('#auth-target').value,level=$('#auth-level').value,focus=$('#auth-focus').value,dailyMinutes=Number($('#auth-minutes').value),days=Number($('#auth-days').value);if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email))return $('#auth-error').textContent='请输入有效的邮箱地址';if(password.length<6)return $('#auth-error').textContent='密码至少需要 6 位';if(authMode!=='login'){if(name.length<2)return $('#auth-error').textContent='显示名称至少需要 2 个字符';if(!Number.isInteger(days)||days<7||days>180)return $('#auth-error').textContent='计划周期请填写 7 到 180 天'}let submit=$('#register-account');submit.disabled=true;submit.textContent='处理中…';try{if(authMode==='login'){let login=await api('/api/_auth/login',{method:'POST',body:JSON.stringify({email,password})});authToken=login.token;storage.set('peak-english-token',authToken);await restoreCloud();close();setRoute('dashboard');say('登录成功，学习记录已恢复')}else if(authMode==='register'){let created=await api('/api/_auth/register',{method:'POST',body:JSON.stringify({name,email,password})});authToken=created.token;storage.set('peak-english-token',authToken);state.profile={name,email,registered:true,target,level,focus,dailyMinutes,days};state.target=target;persist();await syncNow();close();setRoute('dashboard');say('账号创建成功，个人计划已生成')}else{state.profile={name,email,registered:true,target,level,focus,dailyMinutes,days};state.target=target;persist();await syncNow();close();render();say('资料已保存并同步')}}catch(e){$('#auth-error').textContent=e.message||'操作失败，请稍后重试'}finally{submit.disabled=false;if(!modal.hidden)setMode(authMode)}};window.addEventListener('keydown',e=>{if(e.key==='Escape'&&!modal.hidden)close()})}
$('#menu').onclick=()=>$('#side').classList.toggle('open');bindAccount();if(!authToken&&route()!=='welcome')location.hash='/welcome';window.addEventListener('hashchange',render);render();restoreCloud();
</script></body></html>
