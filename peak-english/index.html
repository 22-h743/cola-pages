IELTS:{
 listening:{2025:{title:'Student volunteer hub',text:'The volunteer hub opens at eight on weekdays. New helpers should collect a blue badge from reception before joining the garden team behind the arts building.',question:'What should new helpers collect first?',answer:'A blue badge',options:['A blue badge','A map of the campus','A gardening tool','A lunch voucher']},2024:{title:'Museum evening visit',text:'For Thursday evening visitors, the museum entrance is through the riverside gate. The photography exhibition is on level two, while the talk begins in the ground-floor studio.',question:'Where does the talk take place?',answer:'The ground-floor studio',options:['The riverside gate','Level two','The ground-floor studio','The roof terrace']},2023:{title:'Community garden briefing',text:'Saturday gardeners will meet beside the tool shed at nine. Seeds are supplied, but everyone should bring a reusable water bottle because the public fountain is being repaired.',question:'Why should gardeners bring a water bottle?',answer:'The public fountain is being repaired',options:['Seeds are not supplied','The tool shed is closed','The public fountain is being repaired','The meeting starts early']},2022:{title:'Conference room change',text:'The careers workshop has moved from Room 14 to Room 26 because a larger group registered. Room 26 is reached by taking the lift to the third floor and turning right.',question:'Why was the workshop moved?',answer:'A larger group registered',options:['The lift was repaired','The presenter was late','A larger group registered','Room 14 is on another floor']},2021:{title:'Harbour ferry notice',text:'The noon ferry now leaves ten minutes later, at 12:10, to allow passengers arriving on the regional train to transfer. Tickets are still bought at the small kiosk.',question:'What has changed about the noon ferry?',answer:'Its departure time',options:['Its departure time','Its ticket price','Its destination','Its boarding point']}},
 reading:{2025:{title:'Neighbourhood heat plans',text:'Several neighbourhoods have opened cool rooms in libraries during unusually hot weeks. The rooms matter most when residents know where they are and can reach them easily, so local groups now share maps before summer begins.',question:'What is the main point?',answer:'Access information makes cool rooms more useful',options:['Libraries should close in summer','Heat plans only help young people','Access information makes cool rooms more useful','Maps make temperatures lower']},2024:{title:'Repair culture',text:'A repair café does not promise to fix every broken appliance. Instead, volunteers show owners how to diagnose simple faults and decide whether a repair is safe. This approach builds confidence as well as reducing waste.',question:'Why does the writer value repair cafés?',answer:'They teach practical decision-making while reducing waste',options:['They replace all shops','They guarantee every repair','They teach practical decision-making while reducing waste','They sell new appliances']},2023:{title:'Wildlife corridors',text:'A narrow strip of native plants between two parks may look modest, yet it can allow insects and small animals to move between habitats. Scientists therefore judge a corridor by its connections, not only by its width.',question:'What should be considered when judging a corridor?',answer:'How well it connects habitats',options:['Its colour','How well it connects habitats','The number of benches','Its distance from a city']},2022:{title:'Flexible libraries',text:'Some libraries lend musical instruments as well as books. Borrowing rules are carefully designed: users receive a short orientation and return instruments through a staffed desk. The aim is to make creative activities easier to try.',question:'What is the purpose of the lending scheme?',answer:'To lower the barrier to trying creative activities',options:['To replace music schools','To lower the barrier to trying creative activities','To reduce library opening hours','To sell instruments']},2021:{title:'Household water use',text:'Families often focus on shorter showers when saving water, but a household audit can reveal leaks and inefficient appliances that use water every day. Small repairs may therefore have a larger long-term effect than one-off efforts.',question:'What does the paragraph suggest?',answer:'Regular efficiency improvements can have lasting value',options:['Only showers use water','Audits are unnecessary','Regular efficiency improvements can have lasting value','One-off efforts are always best']}},
 speaking:{2025:{title:'A useful local service',prompt:'Describe a local service that makes daily life easier. Explain who uses it, how it works, and why it is valuable.',hint:'Use one specific example and a clear conclusion.'},2024:{title:'A skill you learned outside class',prompt:'Describe a skill you learned outside formal lessons. Say how you learned it, what was difficult, and how it changed your routine.',hint:'Organise your response as before, during, and after learning.'},2023:{title:'A place for quiet thinking',prompt:'Describe a place where you can think clearly. Say where it is, when you go there, and why it helps you focus.',hint:'Include sensory details, then explain the benefit.'},2022:{title:'A time you solved a small problem',prompt:'Describe a time you solved a small everyday problem. Explain the problem, the steps you took, and what you learned.',hint:'Use past tense and signal the sequence of events.'},2021:{title:'A person who shares knowledge',prompt:'Describe a person who enjoys sharing knowledge. Say what they share, how they help others, and why you remember them.',hint:'Give one concrete example of their influence.'}},

 listening:{2025:{title:'校园志愿活动通知',text:'本周六的校园志愿活动将在图书馆西侧集合。组织者会发放手套，但参加者需要自带饮水杯，以减少一次性用品。',question:'参加者需要自带什么？',answer:'饮水杯',options:['学生证','饮水杯','园艺手册','午餐']},2024:{title:'讲座地点调整',text:'原定在报告厅举行的职业讲座因设备维护改到教学楼 B 座 302 室。讲座开始时间不变，仍为下午三点。',question:'发生了什么变化？',answer:'讲座地点改变了',options:['讲座取消了','讲座地点改变了','开始时间提前了','主讲人更换了']},2023:{title:'图书馆借阅提醒',text:'图书馆新增加了自助归还箱，放在南门入口旁。读者可以在闭馆后归还图书，但借阅咨询仍需在服务台开放时办理。',question:'闭馆后读者可以做什么？',answer:'通过自助归还箱还书',options:['办理借阅咨询','通过自助归还箱还书','进入阅览室','领取新书']},2022:{title:'社团活动安排',text:'摄影社本月的外拍安排在周日上午。为避免拥挤，成员将分成两组，第二组比第一组晚半小时出发。',question:'第二组何时出发？',answer:'比第一组晚半小时',options:['比第一组早半小时','与第一组同时','比第一组晚半小时','在周六下午']},2021:{title:'健康跑报名信息',text:'校园健康跑的报名截止到周四中午。成功报名的同学将在周五收到号码布领取地点的邮件通知。',question:'报名成功后会收到什么？',answer:'号码布领取地点的邮件通知',options:['比赛成绩','训练视频','号码布领取地点的邮件通知','退款信息']}},
 reading:{2025:{title:'主动整理信息',text:'面对大量信息，真正有效的学习并不是不断收藏链接，而是定期筛选、归类，并用自己的话说明资料之间的联系。整理的过程能帮助学习者发现理解上的空白。',question:'文段强调的学习方法是什么？',answer:'通过筛选和复述形成理解',options:['尽可能收藏链接','通过筛选和复述形成理解','只看资料标题','避免记录问题']},2024:{title:'社区小店的作用',text:'社区小店的价值不只在于提供商品。对行动不便的居民而言，熟悉的店员、较短的距离和及时的信息交流，都让日常生活更有保障。',question:'作者主要说明了什么？',answer:'社区小店还提供便利与联系',options:['大商场一定更便宜','社区小店还提供便利与联系','店员不需要服务意识','居民应该减少交流']},2023:{title:'阅读与提问',text:'阅读时提出问题并不意味着读者没有理解。恰恰相反，好的问题能促使读者检验作者的论证，并把新信息与已有经验联系起来。',question:'好的问题有什么作用？',answer:'帮助检验论证并建立联系',options:['替代阅读原文','帮助检验论证并建立联系','减少已有经验','只关注结论']},2022:{title:'节能习惯',text:'节能并非只能依赖昂贵设备。关掉闲置电器、合理设置空调温度和及时维护设备，都是普通家庭可以持续做到的选择。',question:'文段的中心意思是什么？',answer:'日常习惯也能持续节能',options:['节能一定昂贵','日常习惯也能持续节能','只有企业能节能','设备不需要维护']},2021:{title:'合作完成任务',text:'合作并不是简单地把任务平均分配。有效的团队会先确认共同目标，再根据成员的优势安排职责，并在过程中及时沟通调整。',question:'有效合作首先需要什么？',answer:'确认共同目标',options:['平均分配所有任务','确认共同目标','避免沟通','只依靠一个成员']}},
 speaking:{2025:{title:'一次有收获的合作',prompt:'请描述一次你参与的合作任务：任务是什么，你承担了什么角色，以及你从中学到了什么。',hint:'用“背景—行动—结果”组织 1–2 分钟回答。'},2024:{title:'一项改善生活的习惯',prompt:'请描述一项你坚持的好习惯：你何时开始、如何坚持，以及它带来的变化。',hint:'给出一个具体场景，避免只列举观点。'},2023:{title:'一本影响你的书',prompt:'请描述一本给你启发的书：它讲了什么、哪一点令你印象深刻，以及它如何影响你。',hint:'说明内容时简洁，把重点放在个人思考。'},2022:{title:'一次有效沟通',prompt:'请描述一次你通过沟通解决问题的经历：问题是什么、你如何表达、结果如何。',hint:'使用清晰的时间顺序和结果句。'},2021:{title:'一个值得介绍的地方',prompt:'请介绍一个你愿意推荐给朋友的地方：它在哪里、有什么特点，以及推荐的理由。',hint:'先给总评，再用两项细节支持。'}},
 writing:{2025:{title:'大学公共服务',prompt:'大学是否应鼓励学生每学期参与一定时长的公共服务？请阐述你的观点。',hint:'明确立场，并用两条理由和例子展开。'},2024:{title:'碎片化信息',prompt:'短视频和碎片化信息给学习带来便利，也可能削弱深度思考。请讨论并提出建议。',hint:'说明两面影响，再给出可执行建议。'},2023:{title:'城市阅读空间',prompt:'城市是否应投入更多资源建设公共阅读空间？请说明理由。',hint:'从公平、文化和实际使用三个角度选择论据。'},2022:{title:'线上协作',prompt:'线上协作工具是否让团队工作更高效？请结合利弊表达看法。',hint:'避免绝对化，说明适用条件。'},2021:{title:'终身学习',prompt:'在知识更新加快的背景下，个人应如何培养终身学习能力？请写一篇短文。',hint:'提出方法，并解释这些方法为何有效。'}}}

const state={target:saved.target||'IELTS',speed:saved.speed||.85,tasks:saved.tasks||{},mistakes:(saved.mistakes||[]).filter(x=>!String(x.id||'').startsWith('demo')),plan:saved.plan||{1:[false,false,false],2:[false,false,false],3:[false,false]},custom:saved.custom||[],vocab:saved.vocab||[],draft:saved.draft||'',simulations:saved.simulations||saved.papers||{},simulationDrafts:saved.simulationDrafts||{},practiceModes:saved.practiceModes||{},simulationYears:saved.simulationYears||{},profile:saved.profile||{name:'Lin',email:'',registered:false,target:'IELTS',level:'基础待评估',focus:'listening',dailyMinutes:45,days:42}};
let authToken=storage.get('peak-english-token',''),syncTimer=null,authMode='register';
const API_BASE='https://cola-dispatch.marswave-543.workers.dev/peak-english-5c6b72';
async function api(path,options={}){let headers={...(options.headers||{}),'Content-Type':'application/json'};if(authToken)headers.Authorization='Bearer '+authToken;let response=await fetch(API_BASE+path,{...options,headers});let data=await response.json().catch(()=>({}));if(!response.ok)throw new Error(data.error||data.message||'请求失败，请稍后重试');return data}
async function syncNow(){if(!authToken)return;try{await api('/api/state',{method:'PUT',body:JSON.stringify({state})})}catch(e){console.warn('同步暂不可用',e)}}
function scheduleSync(){if(!authToken)return;clearTimeout(syncTimer);syncTimer=setTimeout(syncNow,350)}
function persist(){storage.set('peak-english-state',JSON.stringify(state));const count=document.querySelector('#mistake-count');if(count)count.textContent=state.mistakes.filter(x=>!x.mastered).length||0;scheduleSync()}
async function restoreCloud(){if(!authToken)return false;try{let me=await api('/api/_auth/me');let remote=await api('/api/state');if(remote.state){let incoming=JSON.parse(remote.state);if(incoming&&typeof incoming==='object')Object.assign(state,incoming)}state.mistakes=(state.mistakes||[]).filter(x=>!String(x.id||'').startsWith('demo'));state.profile={...(state.profile||{}),name:me.name||state.profile?.name||'学习者',email:me.email||state.profile?.email||'',registered:true};state.target=state.profile.target||state.target;storage.set('peak-english-state',JSON.stringify(state));render();return true}catch(e){authToken='';storage.set('peak-english-token','');return false}}
function esc(v){return String(v).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function applyProfile(){let p=state.profile||{};let name=(p.name||'Lin').trim()||'Lin',initial=name.slice(0,1).toUpperCase();let avatar=$('#profile-avatar'),label=$('#profile-name'),goal=$('#profile-goal'),action=$('#profile-action');if(avatar)avatar.textContent=initial;if(label)label.textContent=name+' 的学习空间';if(goal)goal.textContent=state.target==='IELTS'?'IELTS 7.5':'CET-6 600+';if(action)action.textContent=p.registered?'编辑资料':'注册账号';let headerAvatar=$('#header-avatar');if(headerAvatar)headerAvatar.textContent=initial}
function say(m){toast.textContent=m;toast.classList.add('show');clearTimeout(window.toast);window.toast=setTimeout(()=>toast.classList.remove('show'),2200)}
function route(){return location.hash.replace('#/','')||(authToken?'dashboard':'welcome')}
function isAdmin(){return String(state.profile?.email||'').toLowerCase()==='admin@peakenglish.site'}
function setRoute(r){if(!authToken&&r!=='welcome'){location.hash='/welcome';say('先创建学习账号，再开始你的训练');return}if(r==='admin'&&!isAdmin()){location.hash='/dashboard';say('没有管理后台访问权限');return}location.hash='/'+r}
function learner(){let p=state.profile||{};return {name:(p.name||'Lin').trim()||'Lin',level:p.level||'基础待评估',focus:p.focus||'listening',minutes:Number(p.dailyMinutes)||45,days:Math.min(180,Math.max(7,Number(p.days)||42))}}
function focusInfo(){return {listening:{title:'听力定位与精听',short:'听力',focus:'地图题与场景词',rows:[['地图题定位专项','每天 1 组 + 整理方位词'],['精听复盘','听写、对照、影子跟读'],['场景词回收','复习 30 个校园与旅行词']]},speaking:{title:'口语流利度与拓展',short:'口语',focus:'Part 2 观点输出',rows:[['Part 2 素材库','积累 3 个可迁移故事'],['2 分钟录音','每周录音 3 次并复听'],['连接词升级','替换重复的 Firstly / Secondly']]},reading:{title:'阅读定位与同义替换',short:'阅读',focus:'定位词与主旨题',rows:[['段落定位训练','每次 2 篇限时精读'],['同义替换本','整理题干与原文替换'],['速度冲刺','每篇控制在 18 分钟内']]},writing:{title:'写作审题与表达',short:'写作',focus:'Task 2 结构与论证',rows:[['审题与立场','每天拆解 2 道题目'],['主体段精写','理由 + 例子各写一段'],['句式升级','复盘 5 个可复用表达']]}}[learner().focus]||{title:'听力定位与精听',short:'听力',focus:'地图题与场景词',rows:[]}}
function adaptivePlan(){let l=learner(),f=focusInfo(),goal=state.target==='IELTS'?'IELTS 7.5':'CET-6 600+';return {1:[['建立诊断基线',`${l.level} → ${goal}；每天 ${l.minutes} 分钟`],['核心词汇回收','每日 50 词 + 间隔复习'],['基础输入复盘','听读各 1 个短任务']],2:f.rows,3:[['全真模考计时',`严格按 ${state.target} 考试时间完成`],['弱项错题清零',`优先复习${f.short}错题并记录原因`]]}}
function layout(title,body){return `<div class="view active"><div class="page-title"><div><h1>${title}</h1><p>每一次有反馈的练习，都会变成考场上的确定性。</p></div><button class="back" data-route="dashboard">← 返回总览</button></div>${body}</div>`}
function welcome(){return `<section class="welcome"><header class="welcome-nav"><div class="welcome-brand"><div class="mark">P</div><div><b>Peak English</b><small>SCORE HIGHER, GO FURTHER</small></div></div><div class="welcome-nav-actions"><button class="welcome-login" id="welcome-login">登录</button><button class="welcome-login" id="welcome-register">创建学习档案</button></div></header><div class="welcome-hero"><div class="welcome-copy"><div class="eyebrow">IELTS · CET-6 · PERSONAL STUDY SYSTEM</div><h1>不是刷题更多，<br>而是<em>练得更准。</em></h1><p>Peak English 为每位学习者生成可执行的冲分路线。告诉我们你的目标、基础、薄弱项和可投入时间，从今天第一项任务开始，把听说读写练成稳定的得分能力。</p><div class="welcome-actions"><button class="welcome-cta" id="welcome-start">免费创建学习档案 →</button><span class="welcome-note">无需下载，注册后立即开始训练</span></div></div><aside class="welcome-preview"><div class="preview-top"><span>个人计划示例</span><span class="preview-user"><span class="avatar">✦</span>为你生成</span></div><div class="preview-hero"><b>从你的目标开始</b><p>填写基础、薄弱项和可用时间，生成专属任务。</p></div><div class="preview-list"><div class="preview-task"><i>01</i>建立个人诊断基线</div><div class="preview-task"><i>02</i>选择优先突破科目</div><div class="preview-task"><i>03</i>开始今日第一项训练</div></div></aside></div><section class="welcome-section"><h2>注册后，你会得到什么？</h2><div class="welcome-grid"><article class="welcome-card"><div class="ico">◎</div><h3>个人冲分计划</h3><p>根据考试目标、当前基础、薄弱项、每日可用时长和周期生成三阶段任务。</p></article><article class="welcome-card"><div class="ico">◉</div><h3>四科主动训练</h3><p>听力朗读、口语计时、阅读反馈、写作草稿与错题复盘，不是只能看的展示页。</p></article><article class="welcome-card"><div class="ico">✦</div><h3>可持续的学习记录</h3><p>任务、词汇、错题、草稿与计划会安全保存；登录后可在其他设备继续学习。</p></article></div><div class="welcome-steps"><span><b>01</b>创建学习档案</span><span><b>02</b>生成个人计划</span><span><b>03</b>开始第一项训练</span></div></section></section>`}
function dashboard(){let done=Object.values(state.tasks).filter(Boolean).length,l=learner(),f=focusInfo();return `<div class="view active"><section class="hero"><div class="hero-copy"><div class="eyebrow">YOUR HIGH-SCORE JOURNEY · 2026</div><h1>早上好，${esc(l.name)}。今天也向高分靠近。✦</h1><p>当前优先突破：${f.focus}。按每天 ${l.minutes} 分钟的节奏练习，<br>把稳定的输入和刻意的输出变成考场上的确定性。</p><div class="meta"><span>${state.target} 目标 ${state.target==='IELTS'?'7.5':'600+'}</span><span>还剩 ${l.days} 天</span><span>今日完成 ${done}/4</span></div></div><div class="ring"><div><b>${Math.min(100,done*25)}%</b><small>备考进度</small></div></div></section><section class="section"><div class="head"><div><h2>本周表现</h2><p>比上周更接近目标一点点</p></div><span class="link">学习报告 →</span></div><div class="stats"><div class="card"><span class="muted">学习时长</span><div class="num">0<em>小时</em></div><div class="up">从第一项任务开始</div></div><div class="card"><span class="muted">词汇掌握</span><div class="num">${state.vocab.length}<em>/ 3</em></div><div class="up">今日高频词</div></div><div class="card"><span class="muted">模考均分</span><div class="num">—<em>待测</em></div><div class="up">完成模考后生成</div></div><div class="card"><span class="muted">连续学习</span><div class="num">${done?1:0}<em>天</em></div><div style="font-size:10px;color:var(--orange);margin-top:5px">稳定完成今日任务</div></div></div></section><section class="section content"><div class="panel"><div class="head"><div><h2 style="font-size:13px">学习时长趋势</h2><p>每日专注时长（小时）</p></div><span class="muted">本周⌄</span></div><div class="chart">${[0,0,0,0,0,0,done?25:0].map((h,i)=>`<div class="barcol ${i===6?'today':''}"><i class="bar" style="height:${h}%"></i><span>${'一二三四五六日'[i]}</span></div>`).join('')}</div></div><div class="panel"><div class="head"><h2 style="font-size:13px">今日任务</h2><span class="link">${done}/4 已完成</span></div><div class="tasks">${[['listening','精听：BBC 6 Minute English','听力','20 min'],['speaking','Part 2 口语录音 · 城市生活','口语','15 min'],['reading','剑雅 18 · Test 2 阅读','阅读','45 min'],['writing','大作文审题与提纲','写作','30 min']].map(x=>`<div class="task ${state.tasks[x[0]]?'done':''}"><button class="check" data-task="${x[0]}">${state.tasks[x[0]]?'✓':''}</button><span class="name">${x[1]}</span><span class="tag">${x[2]}</span><span class="time">${x[3]}</span></div>`).join('')}</div></div></section><section class="section"><div class="head"><div><h2>四科冲分训练</h2><p>针对性练习，补齐你的最后一块短板</p></div><span class="link">训练记录 →</span></div><div class="skills"><article class="skill" data-route="listening"><div class="ico">◉</div><h3>听力 Listening</h3><p>精听 · 影子跟读 · 场景词</p><strong>薄弱项：地图题 →</strong></article><article class="skill" data-route="speaking"><div class="ico">◌</div><h3>口语 Speaking</h3><p>Part 2 · 观点拓展 · 发音</p><strong>待完成 2 个任务 →</strong></article><article class="skill" data-route="reading"><div class="ico">▤</div><h3>阅读 Reading</h3><p>定位 · 同义替换 · 速度</p><strong>正确率 78% ↑</strong></article><article class="skill" data-route="writing"><div class="ico">✎</div><h3>写作 Writing</h3><p>审题 · 结构 · 句式升级</p><strong>草稿自动保存 →</strong></article></div></section><section class="section lower"><div class="panel focus"><div class="kicker">TODAY'S FOCUS</div><h3>攻克地图题定位</h3><p>你的地图题正确率低于整体 16%。今天用 20 分钟掌握方位词 + 地图预判，完成后再做一组专项巩固。</p><div class="pills"><span class="pill">方位词 18 个</span><span class="pill">专项 1 组</span><span class="pill">预计 35 min</span></div><button class="primary" data-route="listening">开始专项训练 →</button></div><div class="panel"><div class="head"><div><h2>冲分路线</h2><p>${l.days} 天 · ${l.level} 到 ${state.target==='IELTS'?'IELTS 7.5':'CET-6 600+'}</p></div><span class="link" data-route="planner">调整计划</span></div>${['基础重建 · 输入提质','专项突破 · 找到提分点','模考冲刺 · 稳定输出'].map((x,i)=>`<div class="route ${i===0?'current':''}"><div class="day">0${i+1}<br>—</div><div class="route-info"><b>${x}</b><span>${['词汇 450 / 精听 3 次 / 语法复盘','小分专项训练 + 每周一次模考','套题计时 + 错题清零 + 考场策略'][i]}</span></div><span class="status ${i?'pending':''}">${i?'未开始':'进行中'}</span></div>`).join('')}</div></section></div>`}
const skillNames={listening:'听力',speaking:'口语',reading:'阅读',writing:'写作'};
function practiceMode(skill){return state.practiceModes?.[skill]||'daily'}
function practiceTabs(skill,mode){return `<div class="tabs" aria-label="${skillNames[skill]}练习模式"><button class="${mode==='daily'?'on':''}" data-practice-mode="daily">日常练习</button><button class="${mode==='simulation'?'on':''}" data-practice-mode="simulation">考场模拟</button></div>`}
function simulationKey(skill,target,year){return `simulation-${target}-${skill}-${year}`}
function simulationView(skill,title){let target=state.target==='IELTS'?'IELTS':'CET-6',year=state.simulationYears?.[skill]||2025,item=simulationBank[target][skill][year],key=simulationKey(skill,target,year),result=state.simulations?.[key],draft=state.simulationDrafts?.[key]||'',years=[2025,2024,2023,2022,2021],isChoice=Array.isArray(item.options),isListening=skill==='listening';let exercise=isChoice?`<span class="tag">原创模拟 · 单题计时</span><h2>${esc(item.title)}</h2><p class="subtle">${isListening?'点击朗读后作答，或直接阅读模拟材料。':'阅读材料后选择最合适的答案。'}</p><div class="${isListening?'audio-box':'reading-text'}">${isListening?`<div class="audio-controls"><button class="play" id="simulation-speak" aria-label="朗读模拟材料">▶</button><span class="muted">原创${target}听力模拟材料</span></div>`:''}<p>${esc(item.text)}</p></div><h3>${esc(item.question)}</h3><div id="simulation-options">${item.options.map((option,index)=>`<button class="option" data-simulation-answer="${index}">${String.fromCharCode(65+index)}. ${esc(option)}</button>`).join('')}</div><button class="blue-btn" id="submit-simulation">提交并记录</button>`:`<span class="tag">原创模拟 · 限时输出</span><h2>${esc(item.title)}</h2><p class="subtle">${esc(item.prompt)}</p><div class="panel" style="background:#f8faff;margin:18px 0"><b>${skill==='speaking'?'建议准备 1 分钟，输出 2 分钟':'建议用时 30 分钟'}</b><p class="subtle" style="margin-bottom:0">${esc(item.hint)}</p></div><textarea class="writing-area" id="simulation-response" placeholder="${skill==='speaking'?'写下你的答题要点或完成口语复盘……':'在这里完成你的模拟写作……'}">${esc(draft)}</textarea><div class="write-tools"><span id="simulation-count">0 words</span><button class="blue-btn" id="submit-simulation">完成并记录</button></div>`;return layout(`考场模拟练习 · ${title}`,`${practiceTabs(skill,'simulation')}<div class="exercise-grid"><div class="exercise-card"><div class="head"><div><h2 style="font-size:14px;margin:0">${target} · ${year} 年</h2><p>按该年份设置的原创能力模拟，不是官方真题或转载材料。</p></div><span class="muted">完成状态会保存并同步</span></div><div class="tabs">${years.map(y=>`<button class="${y===year?'on':''}" data-simulation-year="${y}">${y}</button>`).join('')}</div>${exercise}<div id="simulation-feedback">${result?`<div class="feedback">已完成：${result.ok===false?'待复盘':'已提交'} · ${new Date(result.at).toLocaleString()}</div>`:''}</div><div class="side-stat"><div class="metric"><b>${target}</b><span>${year} 年原创考场模拟</span></div><div class="metric"><b>${skillNames[skill]}</b><span>${isChoice?'作答后即时反馈':'完成输出后保存记录'}</span></div><div class="metric"><b>${result?'已完成':'待完成'}</b><span>本地保存，登录时保持同步</span></div></div></div>`)}
function bindSimulation(skill){let target=state.target==='IELTS'?'IELTS':'CET-6',year=state.simulationYears?.[skill]||2025,item=simulationBank[target][skill][year],key=simulationKey(skill,target,year),selected=-1;$$('[data-simulation-year]').forEach(button=>button.onclick=()=>{state.simulationYears=state.simulationYears||{};state.simulationYears[skill]=Number(button.dataset.simulationYear);persist();render()});if(Array.isArray(item.options)){$$('[data-simulation-answer]').forEach(button=>button.onclick=()=>{selected=Number(button.dataset.simulationAnswer);$$('[data-simulation-answer]').forEach(x=>x.classList.remove('selected'));button.classList.add('selected')});let speak=$('#simulation-speak');if(speak)speak.onclick=()=>{if(!('speechSynthesis'in window))return say('当前浏览器不支持语音朗读');speechSynthesis.cancel();let utterance=new SpeechSynthesisUtterance(item.text);utterance.lang=target==='IELTS'?'en-US':'zh-CN';utterance.rate=state.speed;speechSynthesis.speak(utterance);say('正在朗读模拟材料')};$('#submit-simulation').onclick=()=>{if(selected<0)return say('先选择一个答案');let ok=item.options[selected]===item.answer;$$('[data-simulation-answer]').forEach((button,index)=>{button.classList.toggle('correct',item.options[index]===item.answer);button.classList.toggle('wrong',index===selected&&!ok)});state.simulations=state.simulations||{};state.simulations[key]={complete:true,ok,at:Date.now()};if(!ok)addMistake({id:key,skill:'考场模拟 · '+skillNames[skill],title:item.title,question:item.question,answer:item.answer,reason:'回到原创材料定位关键信息后再判断。',mastered:false});state.tasks[skill]=true;persist();$('#simulation-feedback').innerHTML=`<div class="feedback">${ok?'回答正确。':'正确答案：'+esc(item.answer)+'。'} 已保存本次考场模拟记录。</div>`;say(ok?'模拟练习完成，答得很稳。':'已保存并加入错题本，复盘后再来一次')}}else{let area=$('#simulation-response'),count=()=>{let words=area.value.trim()?area.value.trim().split(/\s+/).filter(Boolean).length:0;$('#simulation-count').textContent=words+' words';state.simulationDrafts=state.simulationDrafts||{};state.simulationDrafts[key]=area.value;persist();return words};area.oninput=count;count();$('#submit-simulation').onclick=()=>{let words=count();if(area.value.trim().length<20)return say('请先完成至少一句有内容的模拟作答');state.simulations=state.simulations||{};state.simulations[key]={complete:true,ok:true,words,at:Date.now()};state.tasks[skill]=true;persist();$('#simulation-feedback').innerHTML='<div class="feedback">模拟作答已保存。请根据提示复盘结构、例证和语言准确度。</div>';say('考场模拟已完成并保存')}}}
function listening(){let mode=practiceMode('listening');if(mode==='simulation')return simulationView('listening','听力训练');return layout('听力训练',practiceTabs('listening',mode)+`<div class="exercise-grid"><div class="exercise-card"><h2>地图题 · Campus café</h2><p class="subtle">先读题定位关键词，再听材料。建议精听三遍：第一遍抓大意，第二遍记定位词，第三遍跟读。</p><div class="audio-box"><span class="muted">Listening script · IELTS Section 2</span><p>The new café is opposite the library, next to the student union. If you are coming from the main gate, walk past the science building and turn left.</p><div class="audio-controls"><button class="play" id="speak">▶</button><span id="audio-label" class="muted">点击播放朗读 · 语速 0.85x</span><button class="speed" id="speed">0.85x</button></div></div><h3>Where is the new café?</h3><div id="listen-options"><button class="option" data-answer="A">A. Behind the science building</button><button class="option" data-answer="B">B. Opposite the library</button><button class="option" data-answer="C">C. Inside the student union</button><button class="option" data-answer="D">D. Near the main gate</button></div><button class="blue-btn" id="submit-listen">提交答案</button><div id="listen-feedback"></div></div><div class="side-stat"><div class="metric"><b>地图题</b><span>当前专项 · 预计 20 min</span></div><div class="metric"><b>78%</b><span>本类题平均正确率</span></div><div class="metric"><b>精听 3 遍</b><span>听写 → 对照 → 跟读</span></div></div></div>`)}
function speaking(){let mode=practiceMode('speaking');if(mode==='simulation')return simulationView('speaking','口语训练');return layout('口语训练',practiceTabs('speaking',mode)+`<div class="exercise-grid"><div class="exercise-card"><h2>IELTS Speaking Part 2</h2><p class="subtle">Describe a city you would like to live in. You should say where it is, what it is like, and explain why you would like to live there.</p><div class="panel" style="background:#f8faff;margin-top:18px"><span class="muted">准备时间</span><div class="timer" id="prep-time">01:00</div><button class="blue-btn" id="prep">开始 1 分钟准备</button><span class="muted" style="margin-left:10px">先写 3 个关键词</span></div><div class="record" id="record-box"><p class="subtle">准备好后进行 2 分钟录音，关注流利度、连接词和观点拓展。</p><button id="record">● 开始录音</button><div class="timer" id="speak-time" style="font-size:24px;margin:12px 0 0">02:00</div><small id="record-note" class="muted">录音会保存在本次浏览器会话中</small></div></div><div class="side-stat"><div class="metric"><b>Part 2</b><span>观点拓展 · 流利度</span></div><div class="metric"><b>3 个</b><span>关键词即可成段</span></div><div class="metric"><b id="record-count">0 次</b><span>本地练习记录</span></div></div></div>`)}
function reading(){let mode=practiceMode('reading');if(mode==='simulation')return simulationView('reading','阅读训练');return layout('阅读训练',practiceTabs('reading',mode)+`<div class="exercise-grid"><div class="exercise-card"><h2>Matching headings · Urban green spaces</h2><div class="reading-text">Urban parks are no longer viewed merely as attractive additions to a city. Recent studies suggest that access to green spaces can reduce stress, encourage physical activity, and strengthen neighbourhood ties. However, simply building a park does not guarantee these benefits. Its design, safety and connection to public transport all influence how often residents use it.</div><h3>Which statement best summarises the paragraph?</h3><div id="read-options"><button class="option" data-answer="A">A. Parks are expensive but beautiful parts of cities.</button><button class="option" data-answer="B">B. Green spaces can improve urban life, but their design affects their use.</button><button class="option" data-answer="C">C. Public transport is the main reason people visit parks.</button></div><button class="blue-btn" id="submit-read">提交答案</button><div id="read-feedback"></div></div><div class="side-stat"><div class="metric"><b>18:42</b><span>本篇建议用时</span></div><div class="metric"><b>定位词</b><span>however · influence</span></div><div class="metric"><b>78%</b><span>你的近期正确率</span></div></div></div>`)}
function writing(){let mode=practiceMode('writing');if(mode==='simulation')return simulationView('writing','写作训练');return layout('写作训练',practiceTabs('writing',mode)+`<div class="exercise-grid"><div class="exercise-card"><h2>IELTS Writing Task 2</h2><p class="subtle">Some people believe that universities should only offer places to students with the highest grades. To what extent do you agree or disagree?</p><textarea class="writing-area" id="draft" placeholder="在这里完成你的 essay。先写清立场，再展开两个主体段……">${state.draft.replace(/</g,'&lt;')}</textarea><div class="write-tools"><span id="word-count">0 words</span><span id="save-state">草稿自动保存</span><button class="blue-btn" id="save-draft">保存草稿</button></div><div id="writing-feedback"></div></div><div class="side-stat"><div class="metric"><b>40 min</b><span>建议完成时长</span></div><div class="metric"><b>250+</b><span>目标字数</span></div><div class="metric"><b>Band 7</b><span>观点清晰 · 衔接自然</span></div></div></div>`)}
function mistakes(){return layout('错题本',`<div class="panel"><div class="head"><div><h2>需要再次攻克的题目</h2><p>每道错题都记录了你的思维断点</p></div><span class="muted">${state.mistakes.filter(x=>!x.mastered).length} 道待复习</span></div><div>${state.mistakes.length?state.mistakes.map(m=>`<div class="mistake" data-id="${m.id}"><div><b>${m.skill} · ${m.title}</b><p>${m.question}<br>答案：<strong>${m.answer}</strong>　${m.reason}</p></div><div class="mini-actions">${m.mastered?'<span class="muted">已掌握</span>':`<button data-master="${m.id}">标记掌握</button>`}<button class="delete" data-delete="${m.id}">删除</button></div></div>`).join(''):'<p class="subtle">错题已清空，继续保持。</p>'}</div></div>`)}
function vocab(){let words=[['sustainable','/səˈsteɪnəbəl/','可持续的','Sustainable transport can reduce carbon emissions.'],['allocate','/ˈæləkeɪt/','分配；拨出','The school should allocate more funds to research.'],['compelling','/kəmˈpelɪŋ/','引人注目的；令人信服的','She gave a compelling reason for her decision.']];return layout('词汇星球',`<div class="head"><div><h2>今日高频词</h2><p>点击卡片翻面，回忆释义后再标记掌握</p></div><span class="link vocab-progress">已掌握 ${state.vocab.length}/3</span></div><div class="vocab-grid">${words.map((w,i)=>`<div class="word-card" data-word="${i}"><div class="word-inner"><div class="word-face"><div class="word">${w[0]}</div><div class="phonetic">${w[1]}</div><span class="muted" style="margin-top:auto">点击查看释义 ↗</span></div><div class="word-face back"><div class="meaning">${w[2]}</div><div class="example">${w[3]}</div><button class="master" data-vocab="${i}">${state.vocab.includes(i)?'已掌握 ✓':'标记掌握'}</button></div></div></div>`).join('')}</div>`)}
function planner(){let phase=window.planPhase||1,l=learner(),f=focusInfo(),plan=adaptivePlan();return layout('冲分计划',`<div class="panel"><div class="head"><div><h2>${l.days} 天个人冲分路线</h2><p>${l.level} · 每天 ${l.minutes} 分钟 · 优先突破：${f.title}</p></div><span class="link">${state.target} · 目标 ${state.target==='IELTS'?'7.5':'600+'}</span></div><div class="tabs">${[1,2,3].map(i=>`<button class="${phase===i?'on':''}" data-phase="${i}">第 ${i} 阶段</button>`).join('')}</div><div>${plan[phase].map((x,i)=>`<label class="plan-item ${state.plan[phase]?.[i]?'done':''}"><input type="checkbox" data-plan="${phase}-${i}" ${state.plan[phase]?.[i]?'checked':''}><div><b>${x[0]}</b><small>${x[1]}</small></div><span class="muted">${state.plan[phase]?.[i]?'完成':'待完成'}</span></label>`).join('')}</div><h3 style="font-size:13px;margin:22px 0 0">自定义任务</h3>${state.custom.map((x,i)=>`<label class="plan-item ${x.done?'done':''}"><input type="checkbox" data-custom="${i}" ${x.done?'checked':''}><div><b>${esc(x.text)}</b><small>自定义 · 加入你的冲分节奏</small></div></label>`).join('')}<div class="add-row"><input id="new-plan" placeholder="例如：周三完成一套听力 Section 3"><button class="blue-btn" id="add-plan">添加任务</button></div></div>`) }
function admin(){return layout('管理后台',`<div class="panel"><div class="head"><div><h2>已同步学习者</h2><p>仅管理员可查看已登录且保存过学习记录的账号资料。</p></div><span class="muted" id="admin-total">读取中…</span></div><div id="admin-content" class="admin-empty">正在加载学习者列表…</div></div>`)}
function render(){clearPageTimers();let r=route();if(!authToken&&r!=='welcome')r='welcome';if(r==='admin'&&!isAdmin())r='dashboard';let html={welcome:welcome,dashboard:dashboard,listening:listening,speaking:speaking,reading:reading,writing:writing,mistakes:mistakes,vocab:vocab,planner:planner,admin:admin}[r]||welcome;$('.app').classList.toggle('welcome-mode',r==='welcome');$('#views').innerHTML=html();$$('[data-route]').forEach(b=>b.onclick=()=>setRoute(b.dataset.route));$$('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.route===r));$('#crumb').textContent='/ '+({welcome:'首页',dashboard:'学习总览',listening:'听力训练',speaking:'口语训练',reading:'阅读训练',writing:'写作训练',mistakes:'错题本',vocab:'词汇星球',planner:'冲分计划',admin:'管理后台'}[r]||'首页');bind(r);$$('[data-target]').forEach(b=>b.onclick=()=>{state.target=b.dataset.target;state.profile.target=state.target;persist();applyProfile();$$('[data-target]').forEach(x=>x.classList.toggle('on',x===b));say('已切换至 '+state.target+' 冲分视图');let activeRoute=route();if(activeRoute==='planner'||(['listening','speaking','reading','writing'].includes(activeRoute)&&practiceMode(activeRoute)==='simulation'))render()});$$('[data-target]').forEach(b=>b.classList.toggle('on',b.dataset.target===state.target));applyProfile();let adminLink=$('#admin-link');if(adminLink)adminLink.classList.toggle('visible',isAdmin());persist()}
function addMistake(m){if(!state.mistakes.some(x=>x.id===m.id))state.mistakes.unshift(m);persist()}
function bind(r){
 let practiceSkill=['listening','speaking','reading','writing'].includes(r)?r:'';if(practiceSkill){$$('[data-practice-mode]').forEach(button=>button.onclick=()=>{state.practiceModes=state.practiceModes||{};state.practiceModes[practiceSkill]=button.dataset.practiceMode;persist();render()});if(practiceMode(practiceSkill)==='simulation')bindSimulation(practiceSkill)}
 if(r==='welcome'){$('#welcome-register').onclick=()=>window.openAuth?.('register');$('#welcome-start').onclick=()=>window.openAuth?.('register');$('#welcome-login').onclick=()=>window.openAuth?.('login')}
 if(r==='dashboard'){$$('.check').forEach(b=>b.onclick=()=>{state.tasks[b.dataset.task]=!state.tasks[b.dataset.task];persist();render();say(state.tasks[b.dataset.task]?'任务完成，节奏很漂亮。':'任务已移回待完成')})}
 if(r==='listening'&&practiceMode('listening')==='daily'){let selected='';$$('#listen-options .option').forEach(b=>b.onclick=()=>{selected=b.dataset.answer;$$('#listen-options .option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected')});$('#submit-listen').onclick=()=>{if(!selected)return say('先选择一个答案');let ok=selected==='B';$$('#listen-options .option').forEach(x=>x.classList.toggle('correct',x.dataset.answer==='B'));if(!ok){$$('#listen-options .option').find(x=>x.dataset.answer===selected).classList.add('wrong');addMistake({id:'listen-'+Date.now(),skill:'听力',title:'地图题方位定位',question:'Where is the new café?',answer:'B. Opposite the library',reason:'opposite to 表示在……对面。',mastered:false})}$('#listen-feedback').innerHTML=`<div class="feedback">${ok?'回答正确！':'答案是 B。'} 先锁定 library 这个参照物，再利用 opposite to 判断位置。${ok?' 已记录为完成。':''}</div>`;state.tasks.listening=true;persist()};let speaking=false,rate=state.speed;$('#speed').textContent=rate.toFixed(2)+'x';$('#audio-label').textContent='点击播放朗读 · 语速 '+rate.toFixed(2)+'x';$('#speed').onclick=()=>{rate=rate===.85?1:rate===1?1.15:.85;state.speed=rate;persist();$('#speed').textContent=rate.toFixed(2)+'x';$('#audio-label').textContent='已切换至 '+rate.toFixed(2)+'x 语速'};$('#speak').onclick=()=>{if(!('speechSynthesis'in window))return say('当前浏览器不支持语音朗读');if(speaking){speechSynthesis.cancel();speaking=false;$('#speak').textContent='▶';$('#audio-label').textContent='已暂停朗读';return}let u=new SpeechSynthesisUtterance('The new café is opposite the library, next to the student union. If you are coming from the main gate, walk past the science building and turn left.');u.lang='en-US';u.rate=rate;u.onend=()=>{speaking=false;$('#speak').textContent='▶';$('#audio-label').textContent='朗读完成，可再听一遍'};speechSynthesis.speak(u);speaking=true;$('#speak').textContent='Ⅱ';$('#audio-label').textContent='正在朗读 · 点击暂停'} }
 if(r==='speaking'&&practiceMode('speaking')==='daily'){let prepTimer,recordTimer,prepSec=60,speakSec=120,recorder,stream;const fmt=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');$('#prep').onclick=()=>{clearInterval(prepTimer);prepSec=60;$('#prep').textContent='准备中…';prepTimer=setInterval(()=>{prepSec--;$('#prep-time').textContent=fmt(prepSec);if(prepSec<=0){clearInterval(prepTimer);$('#prep').textContent='准备完成，开始输出';say('准备时间结束，进入 2 分钟输出')}} ,1000);pageTimers.push(prepTimer)};$('#record').onclick=async()=>{if(recorder&&recorder.state==='recording'){recorder.stop();stream?.getTracks().forEach(t=>t.stop());return}if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder){$('#record-note').textContent='当前环境无法访问麦克风，已切换为无录音计时模式';startSpeakingTimer();return}try{stream=await Promise.race([navigator.mediaDevices.getUserMedia({audio:true}),new Promise((_,reject)=>setTimeout(()=>reject(new Error('麦克风请求超时')),1500))]);recorder=new MediaRecorder(stream);recorder.onstop=()=>{clearInterval(recordTimer);state.tasks.speaking=true;persist();$('#record').textContent='● 开始录音';$('#record-box').classList.remove('recording');$('#record-note').textContent='本次练习已记录（音频仅保留在当前会话）';let n=Number(storage.get('peak-records','0'))+1;storage.set('peak-records',String(n));$('#record-count').textContent=n+' 次'};recorder.start();$('#record').textContent='■ 停止并保存';$('#record-box').classList.add('recording');startSpeakingTimer()}catch(e){$('#record-note').textContent='未获得麦克风权限，已切换为无录音计时模式';startSpeakingTimer()}};function startSpeakingTimer(){clearInterval(recordTimer);speakSec=120;recordTimer=setInterval(()=>{speakSec--;$('#speak-time').textContent=fmt(speakSec);if(speakSec<=0){clearInterval(recordTimer);state.tasks.speaking=true;persist();if(recorder?.state==='recording')recorder.stop();say('2 分钟输出完成，记得复盘连接词')}} ,1000);pageTimers.push(recordTimer)}$('#record-count').textContent=storage.get('peak-records','0')+' 次'}
 if(r==='reading'&&practiceMode('reading')==='daily'){let selected='';$$('#read-options .option').forEach(b=>b.onclick=()=>{selected=b.dataset.answer;$$('#read-options .option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected')});$('#submit-read').onclick=()=>{if(!selected)return say('先选择一个答案');let ok=selected==='B';$$('#read-options .option').forEach(x=>x.classList.toggle('correct',x.dataset.answer==='B'));if(!ok){$$('#read-options .option').find(x=>x.dataset.answer===selected).classList.add('wrong');addMistake({id:'read-'+Date.now(),skill:'阅读',title:'段落主旨概括',question:'Which statement best summarises the paragraph?',answer:'B. Green spaces can improve urban life, but their design affects their use.',reason:'转折句后的 design / use 是主旨落点。',mastered:false})}$('#read-feedback').innerHTML=`<div class="feedback">${ok?'回答正确！':'答案是 B。'} 文章先说益处，however 后补充使用效果取决于设计，这是典型主旨结构。</div>`;state.tasks.reading=true;persist()}}
 if(r==='writing'&&practiceMode('writing')==='daily'){const area=$('#draft'),count=()=>{let n=area.value.trim()?area.value.trim().split(/\s+/).length:0;$('#word-count').textContent=n+' words';state.draft=area.value;persist();$('#save-state').textContent='已自动保存 · '+new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})};area.oninput=count;count();$('#save-draft').onclick=()=>{count();state.tasks.writing=true;persist();$('#writing-feedback').innerHTML='<div class="feedback checklist"><div class="check-item">✓ 是否在开头明确表达 agree / disagree 立场</div><div class="check-item">✓ 两个主体段是否各自包含理由 + 例子</div><div class="check-item">○ 检查连接词是否自然，避免重复使用 Firstly</div></div>';say('草稿已保存，写作任务已完成')}}
 if(r==='mistakes'){$$('[data-master]').forEach(b=>b.onclick=()=>{let x=state.mistakes.find(x=>x.id===b.dataset.master);if(x)x.mastered=true;persist();render();say('已标记掌握，继续保持')});$$('[data-delete]').forEach(b=>b.onclick=()=>{state.mistakes=state.mistakes.filter(x=>x.id!==b.dataset.delete);persist();render();say('错题已删除')})}
 if(r==='vocab'){$$('.word-card').forEach(c=>c.onclick=e=>{if(e.target.matches('[data-vocab]')){let i=Number(e.target.dataset.vocab);if(!state.vocab.includes(i))state.vocab.push(i);persist();e.target.textContent='已掌握 ✓';let progress=$('.vocab-progress');if(progress)progress.textContent='已掌握 '+state.vocab.length+'/3';say('已加入掌握词汇')}else c.classList.toggle('flipped')})}
 if(r==='admin'){api('/api/admin/learners').then(data=>{let target=$('#admin-content');if(!target)return;$('#admin-total').textContent=(data.total||0)+' 位学习者';let rows=data.learners||[];target.innerHTML=rows.length?`<table class="admin-table"><thead><tr><th>学习者</th><th>目标与基础</th><th>重点</th><th>计划</th><th>最后同步</th></tr></thead><tbody>${rows.map(x=>`<tr><td><b>${esc(x.name)}</b><br><span class="muted">${esc(x.email)}</span></td><td>${esc(x.target)}<br><span class="muted">${esc(x.level)}</span></td><td>${esc(x.focus)}</td><td>${x.dailyMinutes} 分钟 / ${x.days} 天</td><td>${x.updatedAt?new Date(x.updatedAt).toLocaleString():'—'}</td></tr>`).join('')}</tbody></table>`:'<div class="admin-empty">还没有学习者完成首次同步。</div>'}).catch(e=>{let target=$('#admin-content');if(target)target.textContent='读取失败：'+e.message});}
 if(r==='planner'){ $$('[data-phase]').forEach(b=>b.onclick=()=>{window.planPhase=Number(b.dataset.phase);render()});$$('[data-plan]').forEach(c=>c.onchange=()=>{let [p,i]=c.dataset.plan.split('-').map(Number);state.plan[p][i]=c.checked;persist();render();say(c.checked?'计划已完成':'已取消完成')});$$('[data-custom]').forEach(c=>c.onchange=()=>{state.custom[Number(c.dataset.custom)].done=c.checked;persist();render()});$('#add-plan').onclick=()=>{let input=$('#new-plan');if(!input.value.trim())return say('先写下一个计划任务');state.custom.push({text:input.value.trim(),done:false});persist();render();say('自定义任务已加入计划')}}}
function bindAccount(){const modal=$('#auth-modal'),close=()=>modal.hidden=true;const setMode=mode=>{authMode=mode;let login=mode==='login',edit=mode==='edit';modal.classList.toggle('login-mode',login);$('#auth-error').textContent='';$('#auth-password').value='';$('#auth-title').textContent=login?'登录学习账号':edit?'编辑学习资料':'创建学习账号';$('#register-account').textContent=login?'登录并同步数据':edit?'保存资料并同步':'创建账号并生成计划';$('#auth-toggle').textContent=login?'没有账号？创建学习账号':'已有账号？登录';$('#auth-status').textContent=login?'登录后将恢复你的学习记录':edit?'保存后会同步并重算你的个人计划':'创建后可在其他设备登录并同步记录'};const open=(mode=authToken?'edit':'register')=>{let p=state.profile||{};$('#auth-name').value=p.registered?p.name||'':'';$('#auth-email').value=p.registered?p.email||'':'';$('#auth-target').value=p.target||state.target;$('#auth-level').value=p.level||'基础待评估';$('#auth-focus').value=p.focus||'listening';$('#auth-minutes').value=String(p.dailyMinutes||45);$('#auth-days').value=p.days||42;setMode(mode);modal.hidden=false;$('#auth-email').focus()};window.openAuth=open;$('#account-btn').onclick=()=>open();$('#auth-close').onclick=close;modal.onclick=e=>{if(e.target===modal)close()};$('#auth-toggle').onclick=()=>open(authMode==='login'?'register':'login');$('#register-account').onclick=async()=>{let name=$('#auth-name').value.trim(),email=$('#auth-email').value.trim(),password=$('#auth-password').value,target=$('#auth-target').value,level=$('#auth-level').value,focus=$('#auth-focus').value,dailyMinutes=Number($('#auth-minutes').value),days=Number($('#auth-days').value);if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email))return $('#auth-error').textContent='请输入有效的邮箱地址';if(password.length<6)return $('#auth-error').textContent='密码至少需要 6 位';if(authMode!=='login'){if(name.length<2)return $('#auth-error').textContent='显示名称至少需要 2 个字符';if(!Number.isInteger(days)||days<7||days>180)return $('#auth-error').textContent='计划周期请填写 7 到 180 天'}let submit=$('#register-account');submit.disabled=true;submit.textContent='处理中…';try{if(authMode==='login'){let login=await api('/api/_auth/login',{method:'POST',body:JSON.stringify({email,password})});authToken=login.token;storage.set('peak-english-token',authToken);await restoreCloud();close();setRoute('dashboard');say('登录成功，学习记录已恢复')}else if(authMode==='register'){let created=await api('/api/_auth/register',{method:'POST',body:JSON.stringify({name,email,password})});authToken=created.token;storage.set('peak-english-token',authToken);state.profile={name,email,registered:true,target,level,focus,dailyMinutes,days};state.target=target;persist();await syncNow();close();setRoute('dashboard');say('账号创建成功，个人计划已生成')}else{state.profile={name,email,registered:true,target,level,focus,dailyMinutes,days};state.target=target;persist();await syncNow();close();render();say('资料已保存并同步')}}catch(e){$('#auth-error').textContent=e.message||'操作失败，请稍后重试'}finally{submit.disabled=false;if(!modal.hidden)setMode(authMode)}};window.addEventListener('keydown',e=>{if(e.key==='Escape'&&!modal.hidden)close()})}
$('#menu').onclick=()=>$('#side').classList.toggle('open');bindAccount();if(!authToken&&route()!=='welcome')location.hash='/welcome';window.addEventListener('hashchange',render);render();restoreCloud();
</script></body></html>
